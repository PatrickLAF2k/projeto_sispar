tags:
  - Colaborador
description: Endpoint para cadastrar um colaborador.

parameters:
  - name: body
    in: body
    required: true
    schema:
      type: object
      required:
        - nome
        - email
        - senha
        - cargo
        - salario
      properties:
        nome:
          type: string
          example: John Doe
        email:
          type: string
          example: johndoe@email.com
        cargo:
          type: string
          example: Ux designer
        senha:
          type: string
          example: "1234567"
        salario:
          type: string
          example: "1500.00"

responses:
  201:
    description: Cadastrado com sucesso!
    schema:
      type: object
      properties:
        mensagem:
          type: string
          example: Colaborador John Doe cadastrado com sucesso!

  400:
    description: Requisição mal formada.
    examples:
      application/json:
        campos_obrigatorios:
          summary: Campos obrigatórios ausentes
          value:
            mensagem: "Todos os campos são obrigatórios."
        email_invalido:
          summary: E-mail com formato inválido
          value:
            mensagem: "Email com formato inválido."
        senha_curta:
          summary: Senha muito curta
          value:
            mensagem: "Senha deve ter no mínimo 6 caracteres."
        salario_invalido:
          summary: Salário em formato inválido
          value:
            mensagem: "Salário com formato inválido. Ex: 0000.00"

  409:
    description: Conflito de dados.
    examples:
      application/json:
        email_duplicado:
          summary: E-mail já cadastrado
          value:
            mensagem: "Email já cadastrado."

  500:
    description: Erro interno inesperado.
    examples:
      application/json:
        erro:
          summary: Erro inesperado
          value:
            erro: "Ocorreu um erro inesperado: detalhes do erro aqui"

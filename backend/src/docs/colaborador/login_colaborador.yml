tags:
  - Colaborador
description: Endpoint para login de um colaborador.

parameters:
  - name: body
    in: body
    required: true
    schema:
      type: object
      required:
        - email
        - senha
      properties:
        email:
          type: string
          example: johndoe@email.com
        senha:
          type: string
          example: "1234567"

responses:
  200:
    description: Login realizado com sucesso.
    content:
      application/json:
        schema:
          type: object
          properties:
            mensagem:
              type: string
              example: "Login realizado com sucesso!"
            token:
              type: string
              example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
          
  400:
    description: Requisição mal formada.
    content:
      application/json:
        schema:
          type: object
          properties:
            mensagem:
              type: string
              example: "Todos os campos são obrigatórios."
          
  401:
    description: Credenciais inválidas.
    content:
      application/json:
        schema:
          type: object
          properties:
            mensagem:
              type: string
              example: "Email ou senha incorretos."

  404:
    description: Colaborador não encontrado.
    content:
      application/json:
        schema:
          type: object
          properties:
            mensagem:
              type: string
              example: "Colaborador não encontrado."

  500:
    description: Erro interno inesperado.
    content:
      application/json:
        schema:
          type: object
          properties:
            erro:
              type: string
              example: "Ocorreu um erro inesperado: detalhes do erro aqui"
